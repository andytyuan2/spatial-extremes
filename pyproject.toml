[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-extremes"
version = "0.1.0"
description = "Tools for simulating and fitting spatial extremes
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Yuan", email = "andy.yuan2tdsb@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
polars = ["polars>=0.20"]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial-extremes"]

[project.urls]
Homepage = "https://github.com/andytyuan2/spatial-extremes"
